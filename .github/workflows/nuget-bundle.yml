name: Bundle NuGet packages

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "NuGet Package ID"
        required: true
        default: "Newtonsoft.Json"
        type: string

      package_version:
        description: "Exact package version"
        required: true
        default: "13.0.4"
        type: string

      target_framework:
        description: "Target Framework (net48 = .NET Framework 4.8)"
        required: true
        default: "net48"
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Resolve and download NuGet packages
    runs-on: windows-latest

    env:
      PACKAGE_ID: ${{ inputs.package_id }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      TARGET_FRAMEWORK: ${{ inputs.target_framework }}

    steps:

      # ------------------------------------------------------------
      # 1. Show environment information
      # ------------------------------------------------------------
      - name: Show .NET environment
        shell: pwsh
        run: |
          Write-Host "Package:          $env:PACKAGE_ID"
          Write-Host "Version:          $env:PACKAGE_VERSION"
          Write-Host "Target Framework: $env:TARGET_FRAMEWORK"
          Write-Host ""

          dotnet --info

      # ------------------------------------------------------------
      # 2. Validate user inputs
      #
      # Inputs are inserted into an XML project later, so restrict them
      # to characters that are valid for normal NuGet IDs / versions /
      # target framework monikers.
      # ------------------------------------------------------------
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:PACKAGE_ID -notmatch '^[A-Za-z0-9_.-]+$') {
              throw "Invalid Package ID: $env:PACKAGE_ID"
          }

          if ($env:PACKAGE_VERSION -notmatch '^[A-Za-z0-9.+-]+$') {
              throw "Invalid package version: $env:PACKAGE_VERSION"
          }

          if ($env:TARGET_FRAMEWORK -notmatch '^[A-Za-z0-9_.-]+$') {
              throw "Invalid Target Framework: $env:TARGET_FRAMEWORK"
          }

          Write-Host "Inputs are valid."

      # ------------------------------------------------------------
      # 3. Create a temporary SDK-style project
      #
      # Example:
      #   TargetFramework = net48
      #
      # The exact package version is enclosed in [ ] so NuGet cannot
      # silently choose a newer version of the root package.
      # ------------------------------------------------------------
      - name: Create resolver project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\work" |
            Out-Null

          $project = @"
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <TargetFramework>$env:TARGET_FRAMEWORK</TargetFramework>

              <!--
                Important for .NET Framework targets such as net48.
                GitHub's Windows runner contains the required
                .NET Framework targeting packs.
              -->
              <EnableWindowsTargeting>true</EnableWindowsTargeting>

              <!-- Only resolve packages from nuget.org -->
              <RestoreSources>https://api.nuget.org/v3/index.json</RestoreSources>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference
                Include="$env:PACKAGE_ID"
                Version="[$env:PACKAGE_VERSION]" />
            </ItemGroup>

          </Project>
          "@

          $projectPath = "$env:GITHUB_WORKSPACE\work\Resolver.csproj"

          Set-Content `
            -Path $projectPath `
            -Value $project `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Generated Resolver.csproj:"
          Write-Host "----------------------------------------"
          Get-Content $projectPath
          Write-Host "----------------------------------------"

      # ------------------------------------------------------------
      # 4. Let the real NuGet resolver calculate the complete graph
      #
      # project.assets.json will contain:
      #
      #   root package
      #     -> direct dependency
      #        -> transitive dependency
      #           -> transitive dependency
      #              ...
      #
      # The actual packages are restored to a temporary directory,
      # but these extracted files will NOT be included in the output.
      # ------------------------------------------------------------
      - name: Resolve complete dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath = "$env:GITHUB_WORKSPACE\work\Resolver.csproj"
          $packagesPath = "$env:GITHUB_WORKSPACE\.nuget\packages"

          dotnet restore $projectPath `
            --packages $packagesPath `
            --no-cache `
            --force `
            --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          $assetsPath =
            "$env:GITHUB_WORKSPACE\work\obj\project.assets.json"

          if (-not (Test-Path $assetsPath)) {
              throw "project.assets.json was not generated."
          }

          Write-Host ""
          Write-Host "NuGet dependency resolution completed."

      # ------------------------------------------------------------
      # 5. Read project.assets.json
      #
      # We use NuGet's resolved graph rather than recursively parsing
      # .nuspec files ourselves. This means version conflicts and
      # TargetFramework selection have already been resolved by NuGet.
      # ------------------------------------------------------------
      - name: Read resolved package list
        id: packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assetsPath =
            "$env:GITHUB_WORKSPACE\work\obj\project.assets.json"

          $assets =
            Get-Content $assetsPath -Raw |
            ConvertFrom-Json

          $packages = @()

          foreach ($property in $assets.libraries.PSObject.Properties) {

              if ($property.Value.type -ne "package") {
                  continue
              }

              $key = $property.Name

              # Example key:
              #
              #   Newtonsoft.Json/13.0.4
              #
              $slashIndex = $key.LastIndexOf("/")

              if ($slashIndex -lt 1) {
                  throw "Unexpected package key: $key"
              }

              $id =
                $key.Substring(
                  0,
                  $slashIndex
                )

              $version =
                $key.Substring(
                  $slashIndex + 1
                )

              $packagePath =
                [string]$property.Value.path

              if ([string]::IsNullOrWhiteSpace($packagePath)) {
                  throw "Package path is missing for: $key"
              }

              $packages += [PSCustomObject]@{
                  Id      = $id
                  Version = $version
                  Path    = $packagePath
              }
          }

          $packages =
            $packages |
            Sort-Object Path -Unique

          if ($packages.Count -eq 0) {
              throw "No NuGet packages were resolved."
          }

          Write-Host ""
          Write-Host "Resolved packages:"
          Write-Host "========================================"

          $packages |
            Sort-Object Id |
            Format-Table Id, Version -AutoSize

          Write-Host ""
          Write-Host "Total package count: $($packages.Count)"
          Write-Host ""

          # Save package information temporarily for the next step.
          # This file is NOT placed in the final ZIP.
          $packages |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              "$env:GITHUB_WORKSPACE\resolved-packages.json" `
              -Encoding UTF8

      # ------------------------------------------------------------
      # 6. Download the ORIGINAL .nupkg files from nuget.org
      #
      # NuGet's global package cache mainly contains extracted package
      # contents. Therefore we explicitly download each original nupkg
      # from NuGet's official flat-container API.
      # ------------------------------------------------------------
      - name: Download all nupkg files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageListPath =
            "$env:GITHUB_WORKSPACE\resolved-packages.json"

          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outputDirectory |
            Out-Null

          $packages =
            Get-Content $packageListPath -Raw |
            ConvertFrom-Json

          # ConvertFrom-Json returns a single object rather than an
          # array if there is only one package.
          $packages = @($packages)

          $baseUrl =
            "https://api.nuget.org/v3-flatcontainer"

          $downloaded = 0

          foreach ($package in $packages) {

              $packagePath =
                [string]$package.Path

              # Example:
              #
              # packagePath:
              #   newtonsoft.json/13.0.4
              #
              # fileName:
              #   newtonsoft.json.13.0.4.nupkg

              $fileName =
                ($packagePath -replace '/', '.') +
                ".nupkg"

              $url =
                "$baseUrl/$packagePath/$fileName"

              $destination =
                Join-Path `
                  $outputDirectory `
                  $fileName

              Write-Host ""
              Write-Host "Downloading:"
              Write-Host "  $($package.Id) $($package.Version)"
              Write-Host "  $url"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $destination `
                -MaximumRetryCount 5 `
                -RetryIntervalSec 2

              if (-not (Test-Path $destination)) {
                  throw "Download failed: $fileName"
              }

              if ((Get-Item $destination).Length -eq 0) {
                  throw "Downloaded file is empty: $fileName"
              }

              $downloaded++
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Expected packages:   $($packages.Count)"
          Write-Host "Downloaded packages: $downloaded"
          Write-Host "========================================"

          if ($downloaded -ne $packages.Count) {
              throw "Package count mismatch."
          }

      # ------------------------------------------------------------
      # 7. Verify that the output directory contains ONLY .nupkg files
      # ------------------------------------------------------------
      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          $allFiles =
            Get-ChildItem `
              -Path $outputDirectory `
              -File

          if ($allFiles.Count -eq 0) {
              throw "No files found in output directory."
          }

          $invalidFiles =
            $allFiles |
            Where-Object {
                $_.Extension -ne ".nupkg"
            }

          if ($invalidFiles.Count -gt 0) {
              Write-Host "Unexpected files:"
              $invalidFiles |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "Output contains files other than .nupkg."
          }

          Write-Host ""
          Write-Host "Files that will be included in ZIP:"
          Write-Host "========================================"

          $allFiles |
            Sort-Object Name |
            ForEach-Object {
                Write-Host $_.Name
            }

          Write-Host ""
          Write-Host "Total: $($allFiles.Count) .nupkg files"

      # ------------------------------------------------------------
      # 8. Create the ZIP ourselves
      #
      # The ZIP root contains ONLY:
      #
      #   package1.x.y.z.nupkg
      #   package2.x.y.z.nupkg
      #   package3.x.y.z.nupkg
      #
      # There is NO nested "nupkgs" directory.
      # ------------------------------------------------------------
      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          $zipName =
            "NuGet-$env:PACKAGE_ID-$env:PACKAGE_VERSION-$env:TARGET_FRAMEWORK.zip"

          $zipPath =
            Join-Path `
              $env:GITHUB_WORKSPACE `
              $zipName

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          # .nupkg is already a ZIP-based format, so recompressing it
          # gives little benefit. NoCompression is faster.
          Compress-Archive `
            -Path "$outputDirectory\*.nupkg" `
            -DestinationPath $zipPath `
            -CompressionLevel NoCompression

          if (-not (Test-Path $zipPath)) {
              throw "ZIP creation failed."
          }

          Write-Host ""
          Write-Host "Created:"
          Write-Host $zipPath

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$([Math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"

          # Make the ZIP path available to the next Action step.
          "ZIP_PATH=$zipPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # 9. Upload the ZIP directly
      #
      # upload-artifact v7 supports direct upload of one file.
      # archive:false prevents GitHub from wrapping our ZIP in another
      # artifact ZIP.
      # ------------------------------------------------------------
      - name: Upload NuGet ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 7
