name: Bundle NuGet packages

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "NuGet Package ID"
        required: true
        default: "Newtonsoft.Json"
        type: string

      package_version:
        description: "Exact package version"
        required: true
        default: "13.0.4"
        type: string

      target_framework:
        description: "Target Framework for normal packages (for example: net48, net8.0)"
        required: true
        default: "net8.0"
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Resolve and download NuGet packages
    runs-on: windows-latest

    env:
      PACKAGE_ID: ${{ inputs.package_id }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      TARGET_FRAMEWORK: ${{ inputs.target_framework }}
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      NUGET_FLAT_CONTAINER: https://api.nuget.org/v3-flatcontainer

    steps:
      # ------------------------------------------------------------
      # 1. Show environment information
      # ------------------------------------------------------------
      - name: Show .NET environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Package:          $env:PACKAGE_ID"
          Write-Host "Version:          $env:PACKAGE_VERSION"
          Write-Host "Target Framework: $env:TARGET_FRAMEWORK"
          Write-Host "NuGet source:     $env:NUGET_SOURCE"
          Write-Host ""

          dotnet --info

      # ------------------------------------------------------------
      # 2. Validate user inputs
      #
      # These values are later used in URLs, paths, command arguments,
      # and (for normal packages) XML. Restrict them to characters used
      # by ordinary NuGet IDs / versions / target-framework monikers.
      # ------------------------------------------------------------
      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:PACKAGE_ID -notmatch '^[A-Za-z0-9_.-]+$') {
              throw "Invalid Package ID: $env:PACKAGE_ID"
          }

          if ($env:PACKAGE_VERSION -notmatch '^[A-Za-z0-9.+-]+$') {
              throw "Invalid package version: $env:PACKAGE_VERSION"
          }

          if ($env:TARGET_FRAMEWORK -notmatch '^[A-Za-z0-9_.-]+$') {
              throw "Invalid Target Framework: $env:TARGET_FRAMEWORK"
          }

          Write-Host "Inputs are valid."

      # ------------------------------------------------------------
      # 3. Prepare clean working directories
      #
      # A private NUGET_PACKAGES directory is important for DotnetTool.
      # It lets us enumerate exactly the packages restored for this run,
      # without mixing them with packages preinstalled on the runner.
      # ------------------------------------------------------------
      - name: Prepare working directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
              "$env:GITHUB_WORKSPACE\work",
              "$env:GITHUB_WORKSPACE\.nuget\packages",
              "$env:GITHUB_WORKSPACE\tool-install",
              "$env:GITHUB_WORKSPACE\root-package",
              "$env:GITHUB_WORKSPACE\nupkgs"
          )

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  Remove-Item $path -Recurse -Force
              }

              New-Item -ItemType Directory -Force -Path $path |
                Out-Null
          }

          Write-Host "Working directories prepared."

      # ------------------------------------------------------------
      # 4. Verify the exact version and detect package type
      #
      # We first query the NuGet flat-container version index, then
      # download only the requested root package and inspect its .nuspec.
      #
      # Supported roots:
      #   - Dependency  -> ordinary NuGet package / PackageReference
      #   - DotnetTool  -> .NET tool / dotnet tool install
      #
      # If a package has multiple package types and one is DotnetTool,
      # we treat it as a tool.
      # ------------------------------------------------------------
      - name: Detect package type
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $flatId = $env:PACKAGE_ID.ToLowerInvariant()
          $indexUrl = "$env:NUGET_FLAT_CONTAINER/$flatId/index.json"

          Write-Host "Checking package versions:"
          Write-Host "  $indexUrl"

          try {
              $index = Invoke-RestMethod `
                -Uri $indexUrl `
                -MaximumRetryCount 5 `
                -RetryIntervalSec 2
          }
          catch {
              throw "Unable to read the NuGet version index for '$env:PACKAGE_ID'. $($_.Exception.Message)"
          }

          $availableVersions = @($index.versions)

          if ($availableVersions.Count -eq 0) {
              throw "NuGet returned no versions for package '$env:PACKAGE_ID'."
          }

          # Exact version only. Comparison is case-insensitive so versions
          # containing prerelease labels are still convenient to enter.
          $resolvedVersion =
            $availableVersions |
            Where-Object {
                [string]::Equals(
                    [string]$_,
                    $env:PACKAGE_VERSION,
                    [System.StringComparison]::OrdinalIgnoreCase
                )
            } |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace([string]$resolvedVersion)) {
              Write-Host ""
              Write-Host "Requested version does not exist:"
              Write-Host "  $env:PACKAGE_ID $env:PACKAGE_VERSION"
              Write-Host ""
              Write-Host "Latest versions available on NuGet.org:"

              $availableVersions |
                Select-Object -Last 10 |
                Sort-Object -Descending |
                ForEach-Object {
                    Write-Host "  $_"
                }

              throw "Exact package version was not found on NuGet.org."
          }

          $resolvedVersion = [string]$resolvedVersion
          $flatVersion = $resolvedVersion.ToLowerInvariant()

          $rootFileName = "$flatId.$flatVersion.nupkg"
          $rootUrl =
            "$env:NUGET_FLAT_CONTAINER/$flatId/$flatVersion/$rootFileName"
          $rootPath =
            "$env:GITHUB_WORKSPACE\root-package\$rootFileName"

          Write-Host ""
          Write-Host "Downloading root package for metadata inspection:"
          Write-Host "  $rootUrl"

          Invoke-WebRequest `
            -Uri $rootUrl `
            -OutFile $rootPath `
            -MaximumRetryCount 5 `
            -RetryIntervalSec 2

          if (-not (Test-Path $rootPath)) {
              throw "Root package download failed."
          }

          if ((Get-Item $rootPath).Length -eq 0) {
              throw "Downloaded root package is empty."
          }

          $zip =
            [System.IO.Compression.ZipFile]::OpenRead($rootPath)

          try {
              $nuspecEntry =
                $zip.Entries |
                Where-Object {
                    $_.FullName -match '^[^/\\]+\.nuspec$'
                } |
                Select-Object -First 1

              if ($null -eq $nuspecEntry) {
                  throw "The package does not contain a root .nuspec file."
              }

              $reader =
                [System.IO.StreamReader]::new(
                    $nuspecEntry.Open(),
                    [System.Text.Encoding]::UTF8,
                    $true
                )

              try {
                  $nuspecText = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }
          }
          finally {
              $zip.Dispose()
          }

          [xml]$nuspec = $nuspecText

          $packageTypeNodes =
            @(
              $nuspec.SelectNodes(
                "//*[local-name()='packageTypes']/*[local-name()='packageType']"
              )
            )

          $packageTypes = @()

          foreach ($node in $packageTypeNodes) {
              $name = [string]$node.GetAttribute("name")

              if (-not [string]::IsNullOrWhiteSpace($name)) {
                  $packageTypes += $name
              }
          }

          if ($packageTypes -contains "DotnetTool") {
              $packageKind = "DotnetTool"
          }
          elseif (
              $packageTypes.Count -eq 0 -or
              $packageTypes -contains "Dependency"
          ) {
              $packageKind = "Dependency"
          }
          else {
              $displayTypes = $packageTypes -join ", "
              throw "Unsupported root package type(s): $displayTypes"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Resolved root package"
          Write-Host "========================================"
          Write-Host "ID:             $env:PACKAGE_ID"
          Write-Host "Version:        $resolvedVersion"
          Write-Host "Package kind:   $packageKind"

          if ($packageTypes.Count -gt 0) {
              Write-Host "Package types:  $($packageTypes -join ', ')"
          }
          else {
              Write-Host "Package types:  (not declared; treated as Dependency)"
          }

          Write-Host "========================================"

          "RESOLVED_ROOT_VERSION=$resolvedVersion" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PACKAGE_KIND=$packageKind" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # 5A. NORMAL PACKAGE
      #
      # Create an SDK-style resolver project and let NuGet calculate
      # the complete dependency graph for the requested TFM.
      # ------------------------------------------------------------
      - name: Create resolver project for normal package
        if: env.PACKAGE_KIND == 'Dependency'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = @"
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <TargetFramework>$env:TARGET_FRAMEWORK</TargetFramework>

              <!-- Required when targeting .NET Framework on this runner. -->
              <EnableWindowsTargeting>true</EnableWindowsTargeting>

              <!-- Only resolve from nuget.org. -->
              <RestoreSources>$env:NUGET_SOURCE</RestoreSources>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference
                Include="$env:PACKAGE_ID"
                Version="[$env:RESOLVED_ROOT_VERSION]" />
            </ItemGroup>

          </Project>
          "@

          $projectPath =
            "$env:GITHUB_WORKSPACE\work\Resolver.csproj"

          Set-Content `
            -Path $projectPath `
            -Value $project `
            -Encoding UTF8

          Write-Host "Generated Resolver.csproj:"
          Write-Host "----------------------------------------"
          Get-Content $projectPath
          Write-Host "----------------------------------------"

      - name: Resolve normal package dependency graph
        if: env.PACKAGE_KIND == 'Dependency'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath =
            "$env:GITHUB_WORKSPACE\work\Resolver.csproj"
          $packagesPath =
            "$env:GITHUB_WORKSPACE\.nuget\packages"

          # Keep NuGet's global package folder isolated to this workflow.
          $env:NUGET_PACKAGES = $packagesPath

          dotnet restore $projectPath `
            --packages $packagesPath `
            --no-cache `
            --force `
            --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          $assetsPath =
            "$env:GITHUB_WORKSPACE\work\obj\project.assets.json"

          if (-not (Test-Path $assetsPath)) {
              throw "project.assets.json was not generated."
          }

          Write-Host ""
          Write-Host "Normal NuGet dependency resolution completed."

      # ------------------------------------------------------------
      # 5B. DOTNET TOOL
      #
      # A DotnetTool package cannot be restored as an ordinary
      # PackageReference. Use a LOCAL tool manifest instead of --tool-path.
      #
      # Important:
      #   Local tools are stored in NuGet's global-packages directory.
      #   By overriding NUGET_PACKAGES with our clean per-run directory,
      #   we can enumerate the exact package set restored for this tool.
      #
      #   Do NOT pass --framework together with --local here. GitHub-hosted
      #   runners can reject that combination with:
      #     The local option(--local) does not support the framework option.
      #   The SDK will select the appropriate framework for the tool package.
      # ------------------------------------------------------------
      - name: Resolve .NET Tool dependency graph
        if: env.PACKAGE_KIND == 'DotnetTool'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packagesPath =
            "$env:GITHUB_WORKSPACE\.nuget\packages"
          $toolWorkPath =
            "$env:GITHUB_WORKSPACE\work\tool-local"
          # dotnet new tool-manifest --output may create dotnet-tools.json
          # directly under the output directory on current SDKs. Resolve
          # the actual path after generation instead of assuming .config.
          $manifestPath = $null

          # Local tools use NuGet's global-packages directory.
          # Point it at our clean, workflow-private directory.
          $env:NUGET_PACKAGES = $packagesPath

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $toolWorkPath |
            Out-Null

          Push-Location $toolWorkPath

          try {
              Write-Host "Creating local tool manifest..."

              # Explicitly control where the manifest is generated.
              # Do not rely on dotnet template-engine context discovery.
              dotnet new tool-manifest `
                --output $toolWorkPath `
                --force

              if ($LASTEXITCODE -ne 0) {
                  throw "dotnet new tool-manifest failed."
              }

              # Different .NET SDK/template versions may place the manifest
              # either directly in --output or under .config. Prefer the
              # direct output observed on current GitHub runners, but support
              # both layouts.
              $manifestCandidates = @(
                  (Join-Path $toolWorkPath "dotnet-tools.json"),
                  (Join-Path $toolWorkPath ".config\dotnet-tools.json")
              )

              $manifestPath =
                $manifestCandidates |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              if ([string]::IsNullOrWhiteSpace($manifestPath)) {
                  Write-Host "Local tool manifest could not be located."
                  Write-Host ""
                  Write-Host "Files created under tool work directory:"
                  Get-ChildItem `
                    -Path $toolWorkPath `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {
                        Write-Host "  $($_.FullName)"
                    }

                  throw "Local tool manifest was not created."
              }

              Write-Host "Local tool manifest:"
              Write-Host "  $manifestPath"

              Write-Host ""
              Write-Host "Installing local tool only for dependency resolution:"
              Write-Host "  ID:        $env:PACKAGE_ID"
              Write-Host "  Version:   $env:RESOLVED_ROOT_VERSION"
              Write-Host "  Framework: selected automatically by the .NET SDK"
              Write-Host "  Packages:  $packagesPath"
              Write-Host "  Manifest:  $manifestPath"
              Write-Host ""

              dotnet tool install $env:PACKAGE_ID `
                --local `
                --tool-manifest $manifestPath `
                --version $env:RESOLVED_ROOT_VERSION `
                --source $env:NUGET_SOURCE `
                --no-cache `
                --verbosity minimal

              if ($LASTEXITCODE -ne 0) {
                  throw "dotnet tool install --local failed."
              }
          }
          finally {
              Pop-Location
          }

          if (-not (Test-Path $packagesPath)) {
              throw "NuGet global-packages directory was not created: $packagesPath"
          }

          $restoredPackageDirectories =
            @(
              Get-ChildItem `
                -Path $packagesPath `
                -Directory `
                -ErrorAction SilentlyContinue
            )

          Write-Host ""
          Write-Host "Top-level package directories restored:"

          if ($restoredPackageDirectories.Count -eq 0) {
              Write-Host "  (none)"
              throw (
                "dotnet tool install succeeded, but the isolated " +
                "NUGET_PACKAGES directory is empty."
              )
          }

          $restoredPackageDirectories |
            Sort-Object Name |
            ForEach-Object {
                Write-Host "  $($_.Name)"
            }

          Write-Host ""
          Write-Host ".NET Tool dependency resolution completed."

      # ------------------------------------------------------------
      # 6. Build one unified resolved package list
      #
      # Normal packages:
      #   Read NuGet's project.assets.json.
      #
      # DotnetTool packages:
      #   Enumerate the isolated NUGET_PACKAGES directory populated by
      #   dotnet tool install. The directory layout is:
      #
      #     <package-id>/<version>/...
      # ------------------------------------------------------------
      - name: Read resolved package list
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @()

          if ($env:PACKAGE_KIND -eq "Dependency") {

              $assetsPath =
                "$env:GITHUB_WORKSPACE\work\obj\project.assets.json"

              $assets =
                Get-Content $assetsPath -Raw |
                ConvertFrom-Json

              foreach ($property in $assets.libraries.PSObject.Properties) {

                  if ($property.Value.type -ne "package") {
                      continue
                  }

                  $key = $property.Name
                  $slashIndex = $key.LastIndexOf("/")

                  if ($slashIndex -lt 1) {
                      throw "Unexpected package key: $key"
                  }

                  $id =
                    $key.Substring(0, $slashIndex)

                  $version =
                    $key.Substring($slashIndex + 1)

                  $packagePath =
                    [string]$property.Value.path

                  if ([string]::IsNullOrWhiteSpace($packagePath)) {
                      throw "Package path is missing for: $key"
                  }

                  $packages += [PSCustomObject]@{
                      Id      = $id
                      Version = $version
                      Path    = $packagePath
                  }
              }
          }
          elseif ($env:PACKAGE_KIND -eq "DotnetTool") {

              $packagesRoot =
                "$env:GITHUB_WORKSPACE\.nuget\packages"

              $packageDirectories =
                Get-ChildItem `
                  -Path $packagesRoot `
                  -Directory

              foreach ($packageDirectory in $packageDirectories) {

                  $versionDirectories =
                    Get-ChildItem `
                      -Path $packageDirectory.FullName `
                      -Directory

                  foreach ($versionDirectory in $versionDirectories) {

                      $nuspecFile =
                        Get-ChildItem `
                          -Path $versionDirectory.FullName `
                          -Filter "*.nuspec" `
                          -File |
                        Select-Object -First 1

                      $id = $packageDirectory.Name
                      $version = $versionDirectory.Name

                      # Prefer the original casing/value stored in the nuspec
                      # for display, while keeping the directory-based Path for
                      # flat-container download URLs.
                      if ($null -ne $nuspecFile) {
                          try {
                              [xml]$nuspec =
                                Get-Content $nuspecFile.FullName -Raw

                              $idNode =
                                $nuspec.SelectSingleNode(
                                  "//*[local-name()='metadata']/*[local-name()='id']"
                                )

                              $versionNode =
                                $nuspec.SelectSingleNode(
                                  "//*[local-name()='metadata']/*[local-name()='version']"
                                )

                              if (
                                  $null -ne $idNode -and
                                  -not [string]::IsNullOrWhiteSpace($idNode.InnerText)
                              ) {
                                  $id = $idNode.InnerText
                              }

                              if (
                                  $null -ne $versionNode -and
                                  -not [string]::IsNullOrWhiteSpace($versionNode.InnerText)
                              ) {
                                  $version = $versionNode.InnerText
                              }
                          }
                          catch {
                              Write-Warning (
                                "Unable to read nuspec metadata from: " +
                                $nuspecFile.FullName
                              )
                          }
                      }

                      $packagePath =
                        "$($packageDirectory.Name)/$($versionDirectory.Name)"

                      $packages += [PSCustomObject]@{
                          Id      = $id
                          Version = $version
                          Path    = $packagePath
                      }
                  }
              }
          }
          else {
              throw "Unexpected PACKAGE_KIND: $env:PACKAGE_KIND"
          }

          $packages =
            @(
              $packages |
              Sort-Object Path -Unique
            )

          if ($packages.Count -eq 0) {
              throw "No NuGet packages were resolved."
          }

          # Ensure the requested root package is present in the result.
          $rootFound =
            $packages |
            Where-Object {
                [string]::Equals(
                    [string]$_.Id,
                    $env:PACKAGE_ID,
                    [System.StringComparison]::OrdinalIgnoreCase
                ) -and
                [string]::Equals(
                    [string]$_.Version,
                    $env:RESOLVED_ROOT_VERSION,
                    [System.StringComparison]::OrdinalIgnoreCase
                )
            } |
            Select-Object -First 1

          if ($null -eq $rootFound) {
              Write-Host "Resolved package list:"
              $packages |
                Sort-Object Id, Version |
                Format-Table Id, Version, Path -AutoSize

              throw "The requested root package is missing from the resolved package list."
          }

          Write-Host ""
          Write-Host "Resolved packages:"
          Write-Host "========================================"

          $packages |
            Sort-Object Id, Version |
            Format-Table Id, Version -AutoSize

          Write-Host ""
          Write-Host "Root package kind:   $env:PACKAGE_KIND"
          Write-Host "Total package count: $($packages.Count)"
          Write-Host ""

          $packages |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              "$env:GITHUB_WORKSPACE\resolved-packages.json" `
              -Encoding UTF8

      # ------------------------------------------------------------
      # 7. Download the ORIGINAL .nupkg files from nuget.org
      #
      # The NuGet global package folder contains extracted contents.
      # For the final offline bundle we explicitly fetch each original
      # nupkg from NuGet's official flat-container API.
      # ------------------------------------------------------------
      - name: Download all original nupkg files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageListPath =
            "$env:GITHUB_WORKSPACE\resolved-packages.json"
          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          $packages =
            Get-Content $packageListPath -Raw |
            ConvertFrom-Json

          # ConvertFrom-Json returns a single object rather than an
          # array when the JSON contains only one package.
          $packages = @($packages)

          $downloaded = 0

          foreach ($package in $packages) {

              $packagePath =
                ([string]$package.Path).Replace("\\", "/").ToLowerInvariant()

              if ($packagePath -notmatch '^[a-z0-9_.-]+/[a-z0-9.+-]+$') {
                  throw "Unexpected flat-container package path: $packagePath"
              }

              $parts = $packagePath.Split('/')
              $flatId = $parts[0]
              $flatVersion = $parts[1]

              $fileName =
                "$flatId.$flatVersion.nupkg"

              $url =
                "$env:NUGET_FLAT_CONTAINER/$flatId/$flatVersion/$fileName"

              $destination =
                Join-Path $outputDirectory $fileName

              Write-Host ""
              Write-Host "Downloading:"
              Write-Host "  $($package.Id) $($package.Version)"
              Write-Host "  $url"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $destination `
                -MaximumRetryCount 5 `
                -RetryIntervalSec 2

              if (-not (Test-Path $destination)) {
                  throw "Download failed: $fileName"
              }

              if ((Get-Item $destination).Length -eq 0) {
                  throw "Downloaded file is empty: $fileName"
              }

              $downloaded++
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Expected packages:   $($packages.Count)"
          Write-Host "Downloaded packages: $downloaded"
          Write-Host "========================================"

          if ($downloaded -ne $packages.Count) {
              throw "Package count mismatch."
          }

      # ------------------------------------------------------------
      # 8. Verify that the final directory contains ONLY .nupkg files
      # ------------------------------------------------------------
      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          $allFiles =
            @(
              Get-ChildItem `
                -Path $outputDirectory `
                -File
            )

          if ($allFiles.Count -eq 0) {
              throw "No files found in output directory."
          }

          $invalidFiles =
            @(
              $allFiles |
              Where-Object {
                  $_.Extension -ne ".nupkg"
              }
            )

          if ($invalidFiles.Count -gt 0) {
              Write-Host "Unexpected files:"

              $invalidFiles |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw "Output contains files other than .nupkg."
          }

          Write-Host ""
          Write-Host "Files that will be included in ZIP:"
          Write-Host "========================================"

          $allFiles |
            Sort-Object Name |
            ForEach-Object {
                Write-Host $_.Name
            }

          Write-Host ""
          Write-Host "Total: $($allFiles.Count) .nupkg files"

      # ------------------------------------------------------------
      # 9. Create the ZIP ourselves
      #
      # ZIP root contains only .nupkg files. There is no nested
      # "nupkgs" directory.
      # ------------------------------------------------------------
      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outputDirectory =
            "$env:GITHUB_WORKSPACE\nupkgs"

          $zipName =
            "NuGet-$env:PACKAGE_ID-$env:RESOLVED_ROOT_VERSION-$env:TARGET_FRAMEWORK.zip"

          $zipPath =
            Join-Path $env:GITHUB_WORKSPACE $zipName

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          # .nupkg is already ZIP-based, so recompressing gives little
          # benefit. NoCompression is substantially faster here.
          Compress-Archive `
            -Path "$outputDirectory\*.nupkg" `
            -DestinationPath $zipPath `
            -CompressionLevel NoCompression

          if (-not (Test-Path $zipPath)) {
              throw "ZIP creation failed."
          }

          Write-Host ""
          Write-Host "Created:"
          Write-Host $zipPath

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$([Math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"

          "ZIP_PATH=$zipPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # 10. Upload the ZIP directly
      #
      # upload-artifact v7 with archive:false uploads this one ZIP
      # as-is instead of wrapping it in a second artifact ZIP.
      # ------------------------------------------------------------
      - name: Upload NuGet ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 7
